<script>
  (function () {
    var lightbox = document.querySelector('#menu-lightbox');
    var lightboxImage = document.querySelector('#menu-lightbox-image');
    var lightboxTitle = document.querySelector('#menu-lightbox-title');
    var lightboxTagGroups = document.querySelector('#menu-lightbox-tag-groups');
    var lightboxNotes = document.querySelector('#menu-lightbox-notes');
    if (!lightbox || !lightboxImage) return;

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImage.removeAttribute('src');
      document.body.classList.remove('menu-lightbox-open');
    }

    document.querySelectorAll('[data-menu-image]').forEach(function (button) {
      button.addEventListener('click', function () {
        var payload = JSON.parse(decodeURIComponent(button.getAttribute('data-menu-lightbox-payload')));
        lightboxImage.src = button.dataset.menuImage;
        lightboxImage.alt = payload.title + ' 完整图片';
        lightboxTitle.textContent = payload.title;
        lightboxTagGroups.textContent = '';
        [['类别', payload.categories], ['食材', payload.ingredients], ['难度', payload.difficulty]].forEach(function (group) {
          if (!Array.isArray(group[1]) || !group[1].length) return;
          var row = document.createElement('div');
          var label = document.createElement('strong');
          label.textContent = group[0];
          var tags = document.createElement('span');
          group[1].forEach(function (value) {
            var tag = document.createElement('span');
            tag.textContent = value;
            tags.appendChild(tag);
          });
          row.appendChild(label);
          row.appendChild(tags);
          lightboxTagGroups.appendChild(row);
        });
        lightboxNotes.textContent = payload.notes || '';
        lightboxNotes.hidden = !payload.notes;
        lightbox.hidden = false;
        document.body.classList.add('menu-lightbox-open');
        lightbox.querySelector('.menu-lightbox-close').focus();
      });
    });
    lightbox.querySelector('.menu-lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (event) {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
    });
  })();
</script>

        success: function (xmlResponse) {
          // 0x02. parse xml file
          var datas = $("entry", xmlResponse).map(function () {
            return {
              title: $("title", this).text(),
              content: $("content", this).text(),
              url: $("url", this).text()
            };
          }).get();
          $resultContent.innerHTML = "";

          $input.addEventListener('input', function () {
            // 0x03. parse query to keywords list
            var str = '<ul class=\"search-result-list\">';
            var keywords = this.value.trim().toLowerCase().split(/[\s\-]+/);
            $resultContent.innerHTML = "";
            if (this.value.trim().length <= 0) {
              return;
            }
            // 0x04. perform local searching
            datas.forEach(function (data) {
              var isMatch = true;
              var content_index = [];
              if (!data.title || data.title.trim() === '') {
                data.title = "Untitled";
              }
              var orig_data_title = data.title.trim();
              var data_title = orig_data_title.toLowerCase();
              var orig_data_content = data.content.trim().replace(/<[^>]+>/g, "");
              var data_content = orig_data_content.toLowerCase();
              var data_url = data.url;
              var index_title = -1;
              var index_content = -1;
              var first_occur = -1;
              // only match artiles with not empty contents
              if (data_content !== '') {
                keywords.forEach(function (keyword, i) {
                  index_title = data_title.indexOf(keyword);
                  index_content = data_content.indexOf(keyword);

                  if (index_title < 0 && index_content < 0) {
                    isMatch = false;
                  } else {
                    if (index_content < 0) {
                      index_content = 0;
                    }
                    if (i == 0) {
                      first_occur = index_content;
                    }
                    // content_index.push({index_content:index_content, keyword_len:keyword_len});
                  }
                });
              } else {
                isMatch = false;
              }
              // 0x05. show search results
              if (isMatch) {
                str += "<li><a href='" + data_url + "' class='search-result-title'>" + orig_data_title + "</a>";
                var content = orig_data_content;
                if (first_occur >= 0) {
                  // cut out 100 characters
                  var start = first_occur - 20;
                  var end = first_occur + 80;

                  if (start < 0) {
                    start = 0;
                  }

                  if (start == 0) {
                    end = 100;
                  }

                  if (end > content.length) {
                    end = content.length;
                  }

                  var match_content = content.substr(start, end);

                  // highlight all keywords
                  keywords.forEach(function (keyword) {
                    var regS = new RegExp(keyword, "gi");
                    match_content = match_content.replace(regS, "<span class=\"search-keyword\">" + keyword + "</span>");
                  });

                  str += "<p class=\"search-result-abstract\">" + match_content + "...</p>"
                }
                str += "</li>";
              }
            });
            str += "</ul>";
            if (str.indexOf('<li>') === -1) {
              return $resultContent.innerHTML = "<ul><span class='local-search-empty'>没有找到内容，请尝试更换检索词。<span></ul>";
            }
            $resultContent.innerHTML = str;
          });
        },
        error: function(xhr, status, error) {
          $resultContent.innerHTML = ""
          if (xhr.status === 404) {
            $resultContent.innerHTML = "<ul><span class='local-search-empty'>未找到search.xml文件，具体请参考：<a href='https://github.com/zchengsite/hexo-theme-oranges#configuration' target='_black'>configuration</a><span></ul>";
          } else {
            $resultContent.innerHTML = "<ul><span class='local-search-empty'>请求失败，尝试重新刷新页面或稍后重试。<span></ul>";
          }
        }
      });
      $(document).on('click', '#search-close-icon', function() {
        $('#search-input').val('');
        $('#search-result').html('');
      });
    }

    var getSearchFile = function() {
        var path = "/search.xml";
        searchFunc(path, 'search-input', 'search-result');
    }
  </script>
